
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Message Detector</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #4338ca;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #334155;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px #e0e7ff;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .clear-button {
            background: #64748b;
        }

        .clear-button:hover {
            background: #475569;
        }

        .result {
            text-align: center;
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
        }

        .spam {
            color: #b91c1c;
            background: #fee2e2;
        }

        .ham {
            color: #15803d;
            background: #dcfce7;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📩 Spam Message Detector</h1>

        <p class="subtitle">
            Enter a message below to check whether it is spam or legitimate.
        </p>

        <form method="POST">

            <label for="message">Enter Your Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Type your message here..."
                required
            >{{ message }}</textarea>

            <button type="submit">Check Message</button>

        </form>

        {% if prediction %}
            <div class="result {% if prediction == 'SPAM MESSAGE' %}spam{% else %}ham{% endif %}">
                {% if prediction == 'SPAM MESSAGE' %}
                    🚨 {{ prediction }}
                {% else %}
                    ✅ {{ prediction }}
                {% endif %}
            </div>
        {% endif %}

        <button class="clear-button" onclick="window.location.href='/'">
            Clear Message
        </button>

        <p class="footer">
            Powered by Machine Learning · Naive Bayes
        </p>

    </div>

</body>
</html>
